name: Deploy backend (Serverless → AWS Lambda)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "shared/**"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC → AWS
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop → staging, main → production (production requires approval in GitHub Environments)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck -w shared -w backend
          npm test -w shared -w backend

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        working-directory: backend
        run: npx serverless deploy --stage ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE }}

      - name: Smoke test
        run: curl -fsS "${{ vars.API_URL }}/api/health"
