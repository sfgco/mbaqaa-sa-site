name: Deploy frontend (S3 + CloudFront)

on:
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - "shared/**"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop → staging, main → production (production requires approval in GitHub Environments)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint -w frontend
          npm run typecheck -w frontend
          npm test -w frontend

      - name: Build
        run: |
          npm run build -w shared --if-present
          npm run build -w frontend
        env:
          # Empty = same-origin "/api" (CloudFront routes /api/* to the API)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_UPLOAD: ${{ vars.VITE_API_UPLOAD }}
          VITE_API_UPLOAD_KEY: ${{ secrets.VITE_API_UPLOAD_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed files: cache for a year. Old chunks are kept (no --delete) so open tabs keep working.
      - name: Upload hashed assets
        run: >
          aws s3 sync frontend/dist/assets "s3://mbaqaa.sa/assets"
          --cache-control "public,max-age=31536000,immutable"

      # Everything else (index.html, favicon, robots.txt…): always revalidate. Stale root files are removed.
      - name: Upload index.html and static files
        run: >
          aws s3 sync frontend/dist "s3://mbaqaa.sa"
          --exclude "assets/*"
          --delete
          --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
