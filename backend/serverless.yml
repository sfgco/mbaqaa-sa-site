# Deploys go through GitHub Actions (.github/workflows/deploy-backend.yml). Don't run `serverless deploy` locally.
org: sfgco
app: mbaqaa-app
service: mbaqaa-api-services

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, env:AWS_REGION, 'me-south-1'}
  stage: ${opt:stage, 'staging'}
  memorySize: 1024
  timeout: 15
  logRetentionInDays: 30
  environment:
    NODE_ENV: production
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '12h'}
    CORS_ORIGINS: ${env:CORS_ORIGINS, ''}
    COOKIE_SAMESITE: ${env:COOKIE_SAMESITE, 'lax'}

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi:
          path: /api/{proxy+}
          method: "*"
